<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Rigo with Vanilla.js</title>

    <!-- Fontawesome is our recomended library for icons -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
  </head>
  <body class="tapete">
  
    <div class="container-fluid text-center">
      <h1 class="my-5 text-white">Poker Card Generator</h1>
      

      
      <div class="carta d-flex flex-column justify-content-between d-none">
        <div class="carta_icono icono_superior align-items-start"></div>
        <div class="carta_numero align-items-middle"></div>
        <div class="carta_icono icono_inferior align-items-end"></div>
      </div>


      <div class="row mt-5">
        <div class="col mt-5">
          <button type="button" id="btnBarajar" class="btn btn-light">Carta Aleatoria 🎲</button>
           <button type="button" id="btnStartProgramar" class="btn btn-light">▶️</button>
           <button type="button" id="btnStopProgramar" class="btn btn-light d-none">⏹️</button>           
        </div>
      </div>
      <div class="row my-3">
        <div class="col mb-5">
          <button type="button" id="btnDimensiones" class="btn btn-secondary text-white">Dimensiones 📏</button>
        </div>
      </div>

    </div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
